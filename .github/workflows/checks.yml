name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:audio
      - run: dotnet native/audio/bin/Release/net9.0-windows/ProcessAudio.dll --self-test
